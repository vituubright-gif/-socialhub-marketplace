<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialHub Marketplace</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="script.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">SocialHub</div>
  <div class="header-actions">
    <button id="postBtn" class="primary" type="button">Post a Listing</button>
    <button id="signInBtn" class="outline" type="button">Sign in</button>
    <button id="logoutBtn" class="outline hidden" type="button">Log out</button>
  </div>
</header>
<main>
<section class="hero">
<h1>Buy and sell social media assets</h1>
<p>Discover creator pages and digital social properties in one marketplace.</p>
<div class="controls">
<input id="search" type="search" placeholder="Search listings">
<select id="platformFilter">
<option value="all">All platforms</option><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>Facebook</option><option>X</option><option>Other</option>
</select>
<select id="sortFilter"><option value="default">Sort</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
</div>
</section>
<section id="cards" class="grid"></section>
<p id="empty" class="empty hidden">No listings found.</p>
<p id="authStatus" class="status"></p>
</main>

<div id="authModal" class="modal hidden"><div class="modal-box">
<button id="closeAuth" class="close" type="button">&times;</button>
<h2 id="authTitle">Sign in</h2>
<form id="authForm">
<label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" minlength="6" required>
<button id="authSubmit" class="primary full" type="submit">Sign in</button>
</form>
<p id="authMessage" class="message"></p>
<button id="toggleAuth" class="link-button" type="button">Create an account</button>
</div></div>

<div id="listingModal" class="modal hidden"><div class="modal-box">
<button id="closeListing" class="close" type="button">&times;</button>
<h2>Post a Listing</h2>
<p class="hint">Only post accounts or digital properties you have the right to sell.</p>
<form id="listingForm">
<label>Platform</label>
<select id="listingPlatform" required><option value="">Choose a platform</option><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>Facebook</option><option>X</option><option>Other</option></select>
<label>Title</label><input id="listingTitle" maxlength="100" required>
<label>Description</label><textarea id="listingDescription" maxlength="500" rows="4"></textarea>
<label>Followers / subscribers</label><input id="listingFollowers" type="number" min="0" value="0" required>
<label>Price</label><input id="listingPrice" type="number" min="0" step="0.01" value="0" required>
<button id="listingSubmit" class="primary full" type="submit">Publish listing</button>
</form>
<p id="listingMessage" class="message"></p>
</div></div>
</body>
</html>
